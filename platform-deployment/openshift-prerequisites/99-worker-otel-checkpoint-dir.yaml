apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-otel-checkpoint-dir
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.4.0
    systemd:
      units:
        - name: otel-checkpoint-dir.service
          enabled: true
          contents: |
            [Unit]
            Description=Prepare OTel filelog checkpoint directory
            DefaultDependencies=no
            After=local-fs.target
            Before=crio.service kubelet.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/bin/mkdir -p /var/otel/file-checkpoints
            ExecStart=/usr/bin/chown root:root /var/otel/file-checkpoints
            ExecStart=/usr/bin/chmod 0755 /var/otel/file-checkpoints
            ExecStart=/usr/bin/chcon -R -t container_file_t -l s0 /var/otel/file-checkpoints

            [Install]
            WantedBy=multi-user.target
